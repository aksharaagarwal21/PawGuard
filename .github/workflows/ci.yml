# Continuous integration. Mirrors scripts/check.sh, which is the version actually exercised locally.
# NOTE: this workflow has not yet run on a hosted runner (the repository has no remote); see IMPLEMENTATION_STATUS.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - run: corepack enable

      - name: Install dependencies
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile

      - name: Start local Supabase stack (Postgres + Auth + Storage) and broker
        run: |
          echo '[]' > infra/supabase/signing_keys.json
          npx --yes supabase@2.119.0 gen signing-key --algorithm ES256 --append --workdir infra
          npx --yes supabase@2.119.0 start --workdir infra -x studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor,postgres-meta
          docker compose -f infra/docker-compose.yml up -d broker
          uv run python scripts/dev_env.py

      - name: Static checks
        run: |
          uv run ruff check services scripts ml
          pnpm -r typecheck
          pnpm -r lint
          pnpm --filter @pawguard/api-client check-fresh

      - name: Migrations and API tests
        run: |
          (cd services/api && uv run alembic upgrade head)
          uv run pytest -q

      - name: Unit tests and build
        run: |
          pnpm --filter @pawguard/ui test
          pnpm --filter @pawguard/web build

      - name: End-to-end tests (demo tenant only)
        run: |
          uv run pawguard-admin seed-demo
          (uv run uvicorn pawguard_api.main:app --port 8000 --no-access-log &)
          (pnpm --filter @pawguard/web start &)
          npx --yes wait-on@8 http://localhost:8000/health/ready http://localhost:3000/en
          pnpm --filter @pawguard/e2e exec playwright install --with-deps chromium
          pnpm --filter @pawguard/e2e test

      - name: Frontend bundle must not contain secrets
        run: uv run python scripts/check_bundle_secrets.py

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report
