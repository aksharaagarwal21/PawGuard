[project]
name = "pawguard-worker"
version = "0.1.0"
description = "PawGuard 360 background worker: outbox dispatch, media validation, vision inference, campaign planning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pawguard-api",
  "celery[redis]==5.6.3",
  "opencv-python-headless==5.0.0.93",
  "onnxruntime==1.30.0",
  "numpy==2.5.3",
  "pillow==12.3.0",
  "ortools==9.15.6755",
]

[project.scripts]
pawguard-worker = "pawguard_worker.cli:app"

[tool.uv.sources]
pawguard-api = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pawguard_worker"]
